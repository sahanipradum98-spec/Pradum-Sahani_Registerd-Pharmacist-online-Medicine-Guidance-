<!-- Medicine Search Section -->
<section class="container my-4">
  <div class="card shadow p-3">
    <h4 style="color:#003366;">🔎 Medicine Search (by Brand or Salt)</h4>
    <div class="row g-2 align-items-center">
      <div class="col-md-8 col-sm-12">
        <input id="drugInput" class="form-control" placeholder="Enter medicine name, salt or brand..." />
      </div>
      <div class="col-md-4 col-sm-12 text-md-end">
        <button class="btn btn-primary" onclick="searchDrug()">Search</button>
        <button class="btn btn-outline-secondary" onclick="clearResults()">Clear</button>
      </div>
    </div>
    <div id="drugResult" class="row mt-4"></div>
  </div>
</section>

<script>
const medicinesDB = {
  "crocin": { displayName:"Crocin Advance 500mg", salt:"Paracetamol", dose:"500 mg", uses:"Fever, pain relief", company:"GSK", mrp:"₹40 (strip)", img:"https://www.netmeds.com/images/product-v1/600x600/835003/crocin_advance_500mg_tablet_15s_0.jpg" },
  "dolo": { displayName:"Dolo 650", salt:"Paracetamol", dose:"650 mg", uses:"Fever, headache, body pain", company:"Micro Labs", mrp:"₹30 (strip)", img:"https://www.netmeds.com/images/product-v1/600x600/821887/dolo_650mg_tablet_15s_0.jpg" },
  "augmentin": { displayName:"Augmentin 625", salt:"Amoxicillin + Clavulanic Acid", dose:"625 mg", uses:"Bacterial infections", company:"GSK", mrp:"₹180 (strip)", img:"https://www.netmeds.com/images/product-v1/600x600/104435/augmentin_625mg_tablet_10s_0.jpg" },
  "azithral": { displayName:"Azithral 500", salt:"Azithromycin", dose:"500 mg", uses:"Respiratory & skin infections", company:"Cipla", mrp:"₹120 (strip)", img:"https://www.netmeds.com/images/product-v1/600x600/359459/azithral_500mg_tablet_5s_0.jpg" },
  "pantoprazole": { displayName:"Pantoprazole 40 mg", salt:"Pantoprazole", dose:"40 mg", uses:"Acidity, gastric reflux", company:"Sun Pharma", mrp:"₹45 (strip)", img:"https://via.placeholder.com/200x120?text=Pantoprazole" }
};

function searchDrug(){
  const q = document.getElementById('drugInput').value.trim().toLowerCase();
  const out = document.getElementById('drugResult');
  out.innerHTML = '';
  if (!q) {
    out.innerHTML = "<p class='text-danger mt-3'>Please enter a medicine brand or salt.</p>";
    return;
  }
  let found = false;
  for (const key in medicinesDB) {
    const item = medicinesDB[key];
    if (key.includes(q) || item.displayName.toLowerCase().includes(q) || (item.salt && item.salt.toLowerCase().includes(q))) {
      renderMedicineCard(item);
      found = true;
    }
  }
  if (!found) {
    out.innerHTML = "<p class='text-warning mt-3'>No medicine found. Try another name.</p>";
  }
}

function renderMedicineCard(data) {
  const out = document.getElementById('drugResult');
  const col = document.createElement('div');
  col.className = "col-md-4";
  col.innerHTML = `
    <div class="card shadow mb-3">
      <img src="${data.img}" class="card-img-top" alt="${data.displayName}" onerror="this.src='https://via.placeholder.com/200x120?text=Image'">
      <div class="card-body">
        <h5>${data.displayName}</h5>
        <p><strong>Salt:</strong> ${data.salt}</p>
        <p><strong>Dose:</strong> ${data.dose}</p>
        <p><strong>Uses:</strong> ${data.uses}</p>
        <p><strong>Company:</strong> ${data.company}</p>
        <p><strong>MRP:</strong> ${data.mrp}</p>
      </div>
    </div>`;
  out.appendChild(col);
}

function clearResults(){
  document.getElementById('drugInput').value = '';
  document.getElementById('drugResult').innerHTML = '';
}
</script>
